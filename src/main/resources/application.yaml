spring:
  application:
    name: cafe.management.system
  datasource:
    url: jdbc:mysql://localhost:3306/cafemanager
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
